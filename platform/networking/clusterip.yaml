# platform/networking/clusterip.yaml
# ------------------------------------------------------------------------------
# Reusable ClusterIP Service template.
# Use for: internal service-to-service communication within the cluster.
# Copy and customise the name, namespace, port, and selectors.
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: starter-app-clusterip       # CHANGE: <app-name>
  namespace: apps                   # CHANGE: target namespace
  labels:
    app.kubernetes.io/name: starter-app
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: argocd
    environment: dev
    project: starter
  annotations:
    # Prometheus ServiceMonitor discovery
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  # sessionAffinity: ClientIP     # Uncomment for sticky sessions (internal)
  # sessionAffinityConfig:
  #   clientIP:
  #     timeoutSeconds: 10800
  selector:
    app.kubernetes.io/name: starter-app   # Must match Deployment pod labels
  ports:
    - name: http
      protocol: TCP
      port: 80          # Service port
      targetPort: 8080  # Container port — CHANGE to match your app
    - name: metrics
      protocol: TCP
      port: 9090
      targetPort: 9090  # Prometheus metrics port — remove if not needed
