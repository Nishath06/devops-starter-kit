# platform/networking/nodeport.yaml
# ------------------------------------------------------------------------------
# Reusable NodePort Service template.
# Use for: development/testing when you need direct node access,
#          or as a backend for an external load balancer you manage manually.
#
# NOTE: In production EKS, prefer ClusterIP + ALB Ingress over NodePort.
# NodePort exposes ports (30000-32767) on every node — requires SG rule.
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: starter-app-nodeport        # CHANGE: <app-name>-nodeport
  namespace: apps                   # CHANGE: target namespace
  labels:
    app.kubernetes.io/name: starter-app
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: argocd
    environment: dev
    project: starter
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: starter-app
  ports:
    - name: http
      protocol: TCP
      port: 80            # ClusterIP port
      targetPort: 8080    # Container port
      nodePort: 30080     # CHANGE: Fixed node port (30000-32767); omit to auto-assign
