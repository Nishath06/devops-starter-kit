# platform/networking/nginx-ingress.yaml
# ------------------------------------------------------------------------------
# Reusable NGINX Ingress template.
# Use when: NGINX Ingress Controller is deployed instead of (or alongside) AWS ALB.
# NGINX is useful for: advanced routing, rate limiting, mTLS, Lua plugins.
#
# Install NGINX controller: helm install ingress-nginx ingress-nginx/ingress-nginx -n ingress-nginx
# Reference: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/
# ------------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: starter-app-nginx           # CHANGE: <app-name>-nginx
  namespace: apps                   # CHANGE: target namespace
  labels:
    app.kubernetes.io/name: starter-app
    app.kubernetes.io/component: ingress
    app.kubernetes.io/managed-by: argocd
    environment: dev
    project: starter
  annotations:
    # ---- Core NGINX Settings ------------------------------------------------
    kubernetes.io/ingress.class: nginx

    # ---- SSL / TLS (cert-manager integration) -------------------------------
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"    # Enable for auto TLS via cert-manager

    # ---- HTTPS Redirect -----------------------------------------------------
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # ---- Proxy Settings -----------------------------------------------------
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"      # Max request body size

    # ---- Rate Limiting (uncomment to enable) --------------------------------
    # nginx.ingress.kubernetes.io/limit-rps: "100"           # Requests per second
    # nginx.ingress.kubernetes.io/limit-connections: "50"

    # ---- CORS (uncomment if frontend needs cross-origin access) -------------
    # nginx.ingress.kubernetes.io/enable-cors: "true"
    # nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.example.com"
    # nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    # nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type"

    # ---- Session Affinity ---------------------------------------------------
    # nginx.ingress.kubernetes.io/affinity: cookie
    # nginx.ingress.kubernetes.io/session-cookie-name: "route"
    # nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
    # nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"

    # ---- Custom config snippet (advanced — use sparingly) -------------------
    # nginx.ingress.kubernetes.io/configuration-snippet: |
    #   more_set_headers "X-Frame-Options: DENY";
    #   more_set_headers "X-Content-Type-Options: nosniff";

spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.example.com           # CHANGE: your application hostname
      secretName: starter-app-tls  # CHANGE: TLS secret name (managed by cert-manager or manually created)
  rules:
    - host: app.example.com         # CHANGE: your application hostname
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: starter-app-clusterip  # CHANGE: your Service name
                port:
                  name: http
