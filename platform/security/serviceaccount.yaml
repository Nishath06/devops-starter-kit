# platform/security/serviceaccount.yaml
# ------------------------------------------------------------------------------
# Reusable ServiceAccount template with IRSA support.
# IRSA = IAM Roles for Service Accounts — allows pods to assume an IAM role
# without storing AWS credentials in secrets.
#
# How IRSA works:
#   1. Create IAM role with trust policy for the OIDC provider of your EKS cluster.
#   2. Attach the required IAM policy to the role.
#   3. Annotate the ServiceAccount with the role ARN (below).
#   4. Reference this ServiceAccount in your Deployment.
#
# Reference: https://docs.aws.amazon.com/eks/latest/userguide/iam-roles-for-service-accounts.html
# ------------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: starter-app-sa              # CHANGE: <app-name>-sa
  namespace: apps                   # CHANGE: target namespace
  labels:
    app.kubernetes.io/name: starter-app
    app.kubernetes.io/component: security
    app.kubernetes.io/managed-by: argocd
    environment: dev
    project: starter
  annotations:
    # ---- IRSA: Bind this ServiceAccount to an IAM Role ----------------------
    # Uncomment and set the ARN of the IAM role that grants this pod's permissions.
    # The role's trust policy must reference this cluster's OIDC provider.
    #
    # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/starter-app-role
    #
    # Optional: token expiry (default 86400s = 24h)
    # eks.amazonaws.com/token-expiration: "86400"

    # ---- Additional annotations ---------------------------------------------
    description: "ServiceAccount for starter-app workloads"
automountServiceAccountToken: false  # Disable auto-mount; mount explicitly in Deployment
