{{/*
helm/starter-chart/templates/configmap.yaml
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "starter-chart.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "starter-chart.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
