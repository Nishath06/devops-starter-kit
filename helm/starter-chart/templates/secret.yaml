{{/*
helm/starter-chart/templates/secret.yaml
-------------------------------------------------------------------------------
NOTE: In production, replace this with ExternalSecret CRs.
      Remove .Values.secrets and use External Secrets Operator instead.
-------------------------------------------------------------------------------
*/}}
{{- if .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "starter-chart.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "starter-chart.labels" . | nindent 4 }}
  annotations:
    secret-management: "replace-with-external-secrets-in-prod"
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
