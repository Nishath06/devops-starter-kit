# apps/cronjob/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cronjob-sa
  namespace: apps
  labels:
    app.kubernetes.io/name: starter-cronjob
    app.kubernetes.io/component: cronjob
    app.kubernetes.io/managed-by: argocd
    environment: dev
    project: starter
  annotations:
    # CronJobs often need S3 write access for report output
    # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/cronjob-irsa-role
    # IAM policy should include:
    #   s3:PutObject, s3:GetObject (for output bucket)
    #   ses:SendEmail (for notifications)
    #   secretsmanager:GetSecretValue
    description: "ServiceAccount for scheduled CronJob pods"
automountServiceAccountToken: true
