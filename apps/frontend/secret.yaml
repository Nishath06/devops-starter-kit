# apps/frontend/secret.yaml
# See apps/backend/secret.yaml for full documentation on secret management.
apiVersion: v1
kind: Secret
metadata:
  name: frontend-secret
  namespace: apps
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/managed-by: argocd
  annotations:
    secret-management: "replace-with-external-secrets-in-prod"
type: Opaque
stringData:
  # Frontend rarely needs secrets — most config is compile-time or served via API.
  # If you use analytics or third-party APIs that require a key at runtime:
  ANALYTICS_KEY: "CHANGE_ME"
