# apps/frontend/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: apps
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/managed-by: argocd
    environment: dev
    project: starter
  annotations:
    description: "ServiceAccount for frontend NGINX pods"
    # Frontend typically doesn't need AWS API access.
    # Uncomment if you use S3 for config or CloudFront invalidation:
    # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/frontend-irsa-role
automountServiceAccountToken: false
