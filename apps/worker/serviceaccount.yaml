# apps/worker/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker-sa
  namespace: apps
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/managed-by: argocd
    environment: dev
    project: starter
  annotations:
    # Workers need SQS + Secrets Manager access via IRSA
    # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/worker-irsa-role
    # IAM policy should include:
    #   sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes
    #   secretsmanager:GetSecretValue
    #   s3:GetObject, s3:PutObject (if processing files)
    description: "ServiceAccount for background worker pods"
automountServiceAccountToken: true    # Required for IRSA token projection
