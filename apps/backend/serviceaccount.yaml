# apps/backend/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: apps
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: argocd
    environment: dev
    project: starter
  annotations:
    # ---- IRSA: Bind to IAM role for AWS API access --------------------------
    # This role should have policies for: S3, SQS, Secrets Manager, etc.
    # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/backend-irsa-role
    description: "ServiceAccount for backend application"
automountServiceAccountToken: false
