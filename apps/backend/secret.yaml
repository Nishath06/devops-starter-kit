# apps/backend/secret.yaml
# ------------------------------------------------------------------------------
# Backend Secrets — PLACEHOLDER ONLY.
# DO NOT commit real secrets to Git.
#
# In production, use one of:
#   A) External Secrets Operator (recommended):
#      Replace this file with an ExternalSecret CR pointing to AWS Secrets Manager.
#      See the commented ExternalSecret template below.
#
#   B) Sealed Secrets:
#      Encrypt secrets with kubeseal and commit the SealedSecret.
#      kubeseal --format yaml < secret.yaml > sealed-secret.yaml
#
#   C) SOPS + age/KMS:
#      Encrypt the YAML file with SOPS before committing.
#
# For development/demos only — base64 encoded placeholder values:
#   echo -n 'placeholder' | base64
# ------------------------------------------------------------------------------

# ---- Option A: Static Secret (dev/demo only — replace in prod) --------------
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: apps
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: argocd
    environment: dev
    project: starter
  annotations:
    # Reminder to replace with ExternalSecret in production
    secret-management: "replace-with-external-secrets-in-prod"
type: Opaque
stringData:
  # CHANGE ALL VALUES BELOW — these are placeholders
  DB_PASSWORD: "CHANGE_ME_USE_EXTERNAL_SECRETS"
  DB_USERNAME: "app_user"
  JWT_SECRET: "CHANGE_ME_USE_EXTERNAL_SECRETS"
  API_KEY: "CHANGE_ME_USE_EXTERNAL_SECRETS"
  # AWS credentials should NOT be here — use IRSA instead
  # AWS_ACCESS_KEY_ID: ""
  # AWS_SECRET_ACCESS_KEY: ""

---
