# apps/backend/secret.yaml
# ------------------------------------------------------------------------------
# Backend Secrets — PLACEHOLDER ONLY.
# DO NOT commit real secrets to Git.
#
# Production Secret Management Options
# ------------------------------------------------------------------------------
# Option A (Dev/Demo):
#   Kubernetes Secret (stringData) — only for local development or demos.
#
# Option B (Recommended for most apps):
#   External Secrets Operator (ESO) syncs secrets from AWS Secrets Manager
#   into a Kubernetes Secret that the application consumes.
#
# Option C (Recommended for certificates / mounted files):
#   Secrets Store CSI Driver mounts AWS Secrets Manager values directly into
#   the Pod filesystem without creating Kubernetes Secrets.
#
# AWS authentication for both ESO and CSI Driver uses IRSA.
# Never store AWS_ACCESS_KEY_ID or AWS_SECRET_ACCESS_KEY inside Kubernetes.
# ------------------------------------------------------------------------------

# ==============================================================================
# OPTION A — Static Kubernetes Secret (Development / Demo Only)
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: apps
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: argocd
    environment: dev
    project: starter
  annotations:
    secret-management: "replace-with-external-secrets-or-csi-in-production"
type: Opaque

stringData:
  DB_USERNAME: "app_user"
  DB_PASSWORD: "CHANGE_ME_USE_EXTERNAL_SECRETS"
  JWT_SECRET: "CHANGE_ME_USE_EXTERNAL_SECRETS"
  API_KEY: "CHANGE_ME_USE_EXTERNAL_SECRETS"

  # NEVER STORE AWS CREDENTIALS HERE.
  # AWS_ACCESS_KEY_ID: ""
  # AWS_SECRET_ACCESS_KEY: ""

---
# ==============================================================================
# OPTION B — External Secrets Operator (Recommended Production Option)
# ==============================================================================
# Uncomment this block and REMOVE the Secret above.
#
# apiVersion: external-secrets.io/v1beta1
# kind: ExternalSecret
# metadata:
#   name: backend-secret
#   namespace: apps
#   labels:
#     app.kubernetes.io/name: backend
#     app.kubernetes.io/component: backend
#     app.kubernetes.io/managed-by: argocd
#
# spec:
#   refreshInterval: 1h
#
#   secretStoreRef:
#     name: aws-secrets-manager
#     kind: ClusterSecretStore
#
#   target:
#     name: backend-secret
#     creationPolicy: Owner
#
#   data:
#     - secretKey: DB_USERNAME
#       remoteRef:
#         key: /starter/dev/backend
#         property: db_username
#
#     - secretKey: DB_PASSWORD
#       remoteRef:
#         key: /starter/dev/backend
#         property: db_password
#
#     - secretKey: JWT_SECRET
#       remoteRef:
#         key: /starter/dev/backend
#         property: jwt_secret
#
#     - secretKey: API_KEY
#       remoteRef:
#         key: /starter/dev/backend
#         property: api_key

---
# ==============================================================================
# OPTION C — Secrets Store CSI Driver (Mount Secrets Directly from AWS)
# ==============================================================================
# This does NOT create a Kubernetes Secret.
# The secret is mounted inside the container filesystem.
#
# Step 1: Create a SecretProviderClass.
#
# apiVersion: secrets-store.csi.x-k8s.io/v1
# kind: SecretProviderClass
# metadata:
#   name: backend-secrets
#   namespace: apps
#
# spec:
#   provider: aws
#
#   parameters:
#     objects: |
#       - objectName: "/starter/dev/backend"
#         objectType: "secretsmanager"
#
# Step 2: Mount it inside Deployment.
#
# spec:
#   serviceAccountName: backend-sa        # IRSA-enabled ServiceAccount
#
#   volumes:
#     - name: backend-secrets
#       csi:
#         driver: secrets-store.csi.k8s.io
#         readOnly: true
#         volumeAttributes:
#           secretProviderClass: backend-secrets
#
#   containers:
#     - name: backend
#       image: your-image
#
#       volumeMounts:
#         - name: backend-secrets
#           mountPath: /mnt/secrets-store
#           readOnly: true
#
# Secrets become available as files:
#
# /mnt/secrets-store/
# ├── DB_USERNAME
# ├── DB_PASSWORD
# ├── JWT_SECRET
# └── API_KEY
#
# Example (Python/FastAPI):
#
# from pathlib import Path
#
# JWT_SECRET = Path("/mnt/secrets-store/JWT_SECRET").read_text().strip()
# DB_PASSWORD = Path("/mnt/secrets-store/DB_PASSWORD").read_text().strip()
#
# IRSA Role Required:
#   ServiceAccount -> backend-sa
#   IAM Role -> backend-irsa-role
#   Permissions:
#     - secretsmanager:GetSecretValue
#     - secretsmanager:DescribeSecret
#     - kms:Decrypt
#
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY are NOT required.
# Authentication is handled automatically through IRSA.