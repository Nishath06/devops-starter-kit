# apps/backend/configmap.yaml
# ------------------------------------------------------------------------------
# Backend application configuration.
# Contains NON-sensitive configuration only.
# Sensitive values (passwords, tokens, API keys) go in secret.yaml.
#
# GitOps note: Changes here trigger a config diff in ArgoCD and a rolling
# restart (if using helm rollout or checksum annotations in deployment.yaml).
# ------------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: apps
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: argocd
    environment: dev
    project: starter
data:
  # ---- Application settings ------------------------------------------------
  APP_ENV: "dev"
  APP_PORT: "8080"
  LOG_LEVEL: "info"                  # CHANGE: debug | info | warn | error
  LOG_FORMAT: "json"                 # json for structured logging in CloudWatch

  # ---- AWS settings --------------------------------------------------------
  AWS_REGION: "us-east-1"           # CHANGE: your AWS region
  # S3 bucket for file uploads (set actual value from Terraform output)
  S3_BUCKET: "my-app-uploads"       # CHANGE: your S3 bucket name
  # SQS queue URL for async processing
  # SQS_QUEUE_URL: "https://sqs.us-east-1.amazonaws.com/ACCOUNT/queue-name"

  # ---- Service URLs (internal — use Kubernetes DNS) -------------------------
  # Use <service-name>.<namespace>.svc.cluster.local for inter-service calls
  WORKER_SERVICE_URL: "http://worker.apps.svc.cluster.local:80"

  # ---- Database (non-sensitive config) -------------------------------------
  DB_HOST: "rds.example.internal"   # CHANGE: RDS endpoint (from Terraform output)
  DB_PORT: "5432"
  DB_NAME: "appdb"                  # CHANGE: database name
  DB_POOL_MIN: "2"
  DB_POOL_MAX: "10"

  # ---- Cache (non-sensitive config) ----------------------------------------
  REDIS_HOST: "redis.apps.svc.cluster.local"  # CHANGE: Redis service
  REDIS_PORT: "6379"

  # ---- Feature flags -------------------------------------------------------
  FEATURE_FLAG_NEW_UI: "false"
  FEATURE_FLAG_METRICS: "true"

  # ---- CORS settings -------------------------------------------------------
  CORS_ALLOWED_ORIGINS: "https://app.example.com,https://staging.example.com"
