# apps/backend/hpa.yaml
# ------------------------------------------------------------------------------
# HorizontalPodAutoscaler — automatically scales backend pods based on load.
# Requires: Metrics Server installed (bootstrap/install.sh).
#
# Scaling strategy:
#   - Scale OUT when CPU > 70% or Memory > 75%
#   - Scale IN slowly (5 min stabilization window) to avoid flapping
#   - Never below 2 replicas (HA) or above 10 (cost control)
#
# NOTE: HPA manages replicas — set ignoreDifferences on /spec/replicas in ArgoCD.
# ------------------------------------------------------------------------------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: apps
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: argocd
    environment: dev
    project: starter
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend                  # Must match deployment.yaml metadata.name

  minReplicas: 2                   # Minimum for HA; set to 1 for dev to save cost
  maxReplicas: 10                  # Maximum; adjust based on budget and traffic

  metrics:
    # --- CPU-based scaling --------------------------------------------------
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70   # Scale out when average CPU > 70%

    # --- Memory-based scaling -----------------------------------------------
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75   # Scale out when average memory > 75%

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60    # Wait 60s before scaling up again
      policies:
        - type: Pods
          value: 2                      # Add at most 2 pods per scale-up event
          periodSeconds: 60
        - type: Percent
          value: 100                    # Or double the pod count, whichever is larger
          periodSeconds: 60
      selectPolicy: Max                 # Use the policy that adds the most pods

    scaleDown:
      stabilizationWindowSeconds: 300   # Wait 5 min before scaling down (prevent flapping)
      policies:
        - type: Pods
          value: 1                      # Remove at most 1 pod per scale-down event
          periodSeconds: 60
      selectPolicy: Min                 # Be conservative on scale down
