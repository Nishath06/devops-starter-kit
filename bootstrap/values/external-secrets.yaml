# bootstrap/values/external-secrets.yaml
# ------------------------------------------------------------------------------
# Helm values for External Secrets Operator (external-secrets/external-secrets).
# Reference: https://github.com/external-secrets/external-secrets/blob/main/deploy/charts/external-secrets/values.yaml
#
# After installation, create a ClusterSecretStore:
#   - AWS Secrets Manager: use the AwsSecretsManager provider
#   - AWS SSM Parameter Store: use the AwsSsmParameterStore provider
# The IRSA role for the ESO controller must have secretsmanager:GetSecretValue
# and/or ssm:GetParameter permissions.
# ------------------------------------------------------------------------------

replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

# Install CRDs — set to false if managing CRDs separately
installCRDs: true

# Webhook for validation
webhook:
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

certController:
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# ServiceAccount annotations for IRSA
serviceAccount:
  create: true
  annotations:
    # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/external-secrets-operator
    {}
